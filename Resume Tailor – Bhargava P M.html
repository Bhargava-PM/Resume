<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Resume Tailor – Bhargava P M</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1a1d23;--mu:#5d6572;--bd:#dde1e7;--ac:#1d5fd1;--acx:#fff;--ok:#18794e;--wa:#b4540a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14161a;--card:#1d2026;--tx:#eceef2;--mu:#9aa3b0;--bd:#2f343d;--ac:#6ea2ff;--acx:#0b1220;--ok:#5fd09a;--wa:#f0a45d}}
:root[data-theme="dark"]{--bg:#14161a;--card:#1d2026;--tx:#eceef2;--mu:#9aa3b0;--bd:#2f343d;--ac:#6ea2ff;--acx:#0b1220;--ok:#5fd09a;--wa:#f0a45d}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
main{max-width:860px;margin:0 auto;padding:16px}
h1{font-size:1.4rem;margin:.2em 0}
p.sub{color:var(--mu);margin:0 0 14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:14px}
textarea,input{width:100%;font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:10px}
textarea{min-height:180px;resize:vertical}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
button{font:inherit;font-weight:600;border-radius:8px;border:1px solid var(--ac);padding:10px 16px;cursor:pointer;background:var(--ac);color:var(--acx)}
button.sec{background:transparent;color:var(--ac)}
button:disabled{opacity:.5}
.chip{display:inline-block;border-radius:99px;padding:2px 10px;margin:2px;font-size:.85rem;border:1px solid var(--bd)}
.chip.ok{color:var(--ok);border-color:var(--ok)}.chip.wa{color:var(--wa);border-color:var(--wa)}
#msg{color:var(--mu);margin-top:8px}
.paperwrap{overflow-x:auto}
#paper{background:#fff;color:#111;width:100%;min-width:560px;padding:32px 36px;border:1px solid var(--bd);border-radius:6px;font:13px/1.45 Georgia,'Times New Roman',serif}
#paper h2{font-size:13px;letter-spacing:.08em;text-transform:uppercase;border-bottom:1px solid #333;margin:14px 0 6px;padding-bottom:2px}
#paper h3{font-size:13.5px;margin:8px 0 2px}
#paper ul{margin:2px 0 4px;padding-left:18px}
#paper .nm{font-size:24px;font-weight:700;letter-spacing:.03em;text-align:center}
#paper .tl{text-align:center;font-weight:600;margin:2px 0}
#paper .ct{text-align:center;font-size:12px;color:#333}
#paper .tech{font-style:italic;font-weight:400;color:#444}
#paper:focus{outline:2px solid var(--ac)}
.hint{font-size:.85rem;color:var(--mu)}
@media print{
 body{background:#fff}main>*:not(#out){display:none!important}
 #out>*:not(.paperwrap){display:none!important}
 #paper{border:0;padding:0;min-width:0}.paperwrap{overflow:visible}
}
</style>
</head>
<body>
<main>
 <h1>Resume Tailor</h1>
 <p class="sub">Paste a job description. Get a resume rewritten for that role, using only your real skills and projects.</p>

 <div class="card">
  <label for="jd"><b>Job description</b></label>
  <textarea id="jd" placeholder="Paste the full job description here…"></textarea>
  <div class="row">
   <button id="go">Generate tailored resume</button>
   <button id="clr" class="sec">Clear</button>
  </div>
  <div id="msg"></div>
 </div>

 <div id="out" hidden>
  <div class="card" id="analysis"></div>
  <div class="row" style="margin:0 0 10px">
   <button id="dl">Download (.html)</button>
   <button id="pr" class="sec">Print / Save as PDF</button>
  </div>
  <p class="hint">Tap the resume to edit any text before downloading.</p>
  <div class="paperwrap"><div id="paper" contenteditable="true" spellcheck="true"></div></div>
 </div>
</main>

<script>
const M={
 name:"BHARGAVA P M",
 contact:"Davanagere, Karnataka, India | bhargava.maheshwar@gmail.com | 7019301773",
 summary:"MCA graduate with hands-on experience in data analysis, data cleaning, transformation, exploratory analysis, and reporting using SQL, Excel, Python, Pandas, and Power BI. Skilled in SQL joins, CTEs, window functions, subqueries, and aggregations, with practical experience building an Excel MIS dashboard for employee performance and analyzing customer transaction data. Seeking an entry-level Data Analyst opportunity.",
 skills:{
  "Data Analysis":["Data Cleaning","Data Transformation","Exploratory Data Analysis (EDA)","Data Validation","Data Visualization","Reporting","Business Insights"],
  "SQL":["MySQL","Joins","CTEs","Subqueries","Window Functions","Aggregations","Filtering","Sorting"],
  "Excel":["Advanced Excel","XLOOKUP","VLOOKUP","Pivot Tables","Advanced Formulas","Data Validation","Data Cleaning","Power Query","Slicers","KPI Dashboards","MIS Reporting"],
  "Power BI":["Power BI","Power Query","Data Modeling","Dashboard Design"],
  "Python":["Python","Pandas","NumPy","Data Cleaning","Data Transformation","EDA"],
  "Tools":["MySQL","VS Code"]},
 projects:[
  {title:"Employee Performance Analysis Dashboard (Excel)",tech:"Excel | PivotTables | Slicers | MIS Reporting",bullets:[
   "Developed an interactive Excel MIS dashboard analysing 150 employee records across 6 departments, using PivotTables, slicers and KPI cards to track target achievement (98.5%) and performance trends.",
   "Created a weighted performance scoring model (achievement, attendance, quality, customer rating) and rating bands to identify top performers and employees needing improvement.",
   "Identified location-wise performance gaps and delivered recommendations to support data-driven HR and management reporting."]},
  {title:"Bank Customer Transaction Analysis",tech:"Python | Pandas | SQL",bullets:[
   "Analyzed customer transaction data to identify transaction patterns, customer behavior, and high-value customer segments.",
   "Cleaned transaction records by handling missing values, duplicate records, and inconsistent date formats using Pandas.",
   "Applied SQL joins, filtering, grouping, aggregation, and sorting to generate customer-level and transaction-level insights.",
   "Used Pandas to calculate transaction totals, averages, and customer-level metrics.",
   "Identified high-value customers, transaction trends, and differences across transaction types."]}],
 cert:"Python with Data Analytics — Q-Spiders",
 edu:[["Master of Computer Applications (MCA) — 2026","Davanagere University, Davanagere | CGPA: 8.02"],
      ["Bachelor of Computer Applications (BCA) — 2024","Bapuji Institute of Hi-Tech Education, Davanagere | CGPA: 8.33"]],
 langs:"Kannada, English"
};
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let lastRole="Role";

function render(r){
 const sk=(r.skills||[]).map(s=>`<div><b>${esc(s.label)}:</b> ${esc((s.items||[]).join(", "))}</div>`).join("");
 const pj=(r.projects||[]).map(p=>`<h3>${esc(p.title)} <span class="tech">| ${esc(p.tech)}</span></h3><ul>${(p.bullets||[]).map(b=>`<li>${esc(b)}</li>`).join("")}</ul>`).join("");
 const ed=M.edu.map(e=>`<h3>${esc(e[0])}</h3><div>${esc(e[1])}</div>`).join("");
 $("paper").innerHTML=`<div class="nm">${esc(M.name)}</div><div class="tl">${esc(r.headline||"Data Analyst")}</div><div class="ct">${esc(M.contact)}</div>
 <h2>Professional Summary</h2><div>${esc(r.summary)}</div>
 <h2>Technical Skills</h2>${sk}
 <h2>Project Experience</h2>${pj}
 <h2>Certification</h2><div>${esc(M.cert)}</div>
 <h2>Education</h2>${ed}
 <h2>Languages</h2><div>${esc(M.langs)}</div>`;
 const chips=(a,c)=>(a||[]).map(x=>`<span class="chip ${c}">${esc(x)}</span>`).join("")||"<span class='hint'>None</span>";
 $("analysis").innerHTML=`<b>Match for: ${esc(r.role||"this role")}</b>${r.company?" at "+esc(r.company):""}
 <p style="margin:.6em 0 .2em"><b>Keywords you already cover</b></p>${chips(r.matched,"ok")}
 <p style="margin:.6em 0 .2em"><b>Gaps in the job description</b> <span class="hint">(not added to your resume)</span></p>${chips(r.missing,"wa")}
 ${(r.tips||[]).length?`<p style="margin:.6em 0 .2em"><b>Tips</b></p><ul style="margin:0;padding-left:18px">${r.tips.map(t=>`<li>${esc(t)}</li>`).join("")}</ul>`:""}`;
 $("out").hidden=false;
 $("out").scrollIntoView({behavior:"smooth"});
}

async function generate(){
 const jd=$("jd").value.trim();
 if(jd.length<80){$("msg").textContent="Please paste a longer job description.";return}
 $("go").disabled=true;$("msg").textContent="Tailoring your resume…";
 try{
  const sample=await claude.use("sample");
  if(!sample){$("msg").textContent="AI generation isn’t available in this view. Open the page in claude.ai.";return}
  const prompt=`You tailor resumes. Below are a candidate's MASTER RESUME (JSON) and a JOB DESCRIPTION.
Return ONLY JSON with this shape:
{"role":string,"company":string,"headline":string,"summary":string,"skills":[{"label":string,"items":[string]}],"projects":[{"title":string,"tech":string,"bullets":[string]}],"matched":[string],"missing":[string],"tips":[string]}
Rules:
- NEVER invent skills, tools, employers, metrics, or experience. Use only what is in the master resume.
- summary: 2-3 sentences, entry-level fresher tone, mirroring the job description's wording where truthful.
- skills: regroup and reorder so the most relevant to the job come first; use the job's terminology only when the master has the same skill. Drop irrelevant items.
- projects: keep all projects, reorder by relevance, rewrite bullets (3-5 each), keeping the 98.5% target achievement, 150 records and 6 departments figures exactly as given to emphasize job-relevant keywords, truthfully. No made-up numbers.
- headline: the job title, e.g. "Data Analyst".
- matched: job keywords the candidate truly has. missing: important job requirements not in the master resume. tips: up to 3 short, practical suggestions (e.g. what to learn or add to a portfolio).
MASTER RESUME:
${JSON.stringify({summary:M.summary,skills:M.skills,projects:M.projects})}
JOB DESCRIPTION:
${jd.slice(0,9000)}`;
  const r=await sample.json(prompt,{cache:false,modelTier:"default"});
  lastRole=(r.role||"Role").replace(/[^\w]+/g,"_");
  render(r);$("msg").textContent="";
 }catch(e){
  $("msg").textContent=e&&e.code==="not_granted"?"Permission was declined.":"Something went wrong. Please try again.";
 }finally{$("go").disabled=false}
}

async function download(){
 const css="body{margin:0;padding:24px;font:13px/1.45 Georgia,serif;color:#111}h2{font-size:13px;letter-spacing:.08em;text-transform:uppercase;border-bottom:1px solid #333;margin:14px 0 6px}h3{font-size:13.5px;margin:8px 0 2px}ul{margin:2px 0 4px;padding-left:18px}.nm{font-size:24px;font-weight:700;text-align:center}.tl{text-align:center;font-weight:600}.ct{text-align:center;font-size:12px}.tech{font-style:italic;font-weight:400}div.page{max-width:780px;margin:auto}";
 const html=`<!DOCTYPE html><html><head><meta charset="utf-8"><title>Resume</title><style>${css}</style></head><body><div class="page">${$("paper").innerHTML}</div></body></html>`;
 try{
  const d=await claude.use("downloads");
  if(!d){$("msg").textContent="Downloads aren’t available here.";return}
  await d.save({filename:`Bhargava_PM_${lastRole}.html`,data:html});
 }catch(e){if(!e||e.code!=="declined")$("msg").textContent="Couldn’t save the file."}
}

$("go").onclick=generate;
$("clr").onclick=()=>{$("jd").value="";$("out").hidden=true;$("msg").textContent=""};
$("dl").onclick=download;
$("pr").onclick=()=>{try{window.print()}catch(e){$("msg").textContent="Printing is blocked here. Use Download, then print that file."}};
</script>
</body>
</html>
